<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon"             type="image/x-icon"  href="img/favicon.ico">
  <link rel="icon"             type="image/png"     href="img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon"                      href="img/apple-touch-icon.png">
  <meta name="theme-color"     content="#1A2E44">
  <title>Gestión de usuarios — E-Find</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Administrá roles y estados de los usuarios registrados en E-Find.">
  <meta property="og:title"       content="Gestión de usuarios — E-Find">
  <meta property="og:description" content="Administrá roles y estados de los usuarios registrados en E-Find.">
  <meta property="og:image"       content="https://efindapp.com/img/efind-dark.png">
  <meta property="og:type"        content="website">
  <meta name="twitter:card"       content="summary_large_image">
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<main class="main-content page-enter">
<div class="admin-layout">
  <aside class="admin-sidebar anim-fade-in anim-d1">
    <div class="sidebar-section">Principal</div>
    <a href="admin.html"    class="sidebar-link"><span class="ico" data-icon="chart" data-size="18"></span><span>Dashboard</span></a>
    <a href="admin.html#cargadores" class="sidebar-link"><span class="ico" data-icon="bolt" data-size="18"></span><span>Cargadores</span></a>
    <a href="usuarios.html" class="sidebar-link active"><span class="ico" data-icon="users" data-size="18"></span><span>Usuarios</span></a>
    <div class="sidebar-section">Moderación</div>
    <a href="admin.html#resenas"  class="sidebar-link"><span class="ico" data-icon="sun" data-size="18"></span><span>Reseñas</span></a>
    <a href="admin.html#reportes" class="sidebar-link"><span class="ico" data-icon="warning" data-size="18"></span><span>Reportes</span></a>
    <div class="sidebar-section">Sistema</div>
    <a href="index.html" class="sidebar-link"><span class="ico" data-icon="globe" data-size="18"></span><span>Ver mapa</span></a>
  </aside>

  <div class="admin-content anim-fade-up anim-d2">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.75rem">
      <h1 class="admin-title" style="margin-bottom:0">Gestión de usuarios</h1>
      <div style="display:flex;gap:.5rem;align-items:center">
        <select id="f-rol" class="form-select" style="font-size:.85rem;width:auto" onchange="cargarUsuarios(1)">
          <option value="">Todos los roles</option>
          <option value="2">Particular</option>
          <option value="3">Propietario</option>
          <option value="1">Admin</option>
        </select>
        <input type="text" id="f-buscar" class="form-input" style="font-size:.85rem;width:200px"
               placeholder="Buscar nombre o email…" oninput="buscarConRetardo()">
      </div>
    </div>

    <div id="alert-accion" role="status" aria-live="polite" style="display:none;margin-bottom:1rem"></div>

    <div class="card">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Registrado</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tbody-usuarios"></tbody>
        </table>
      </div>
      <div id="sin-resultados" style="display:none">
        <div class="empty-state">
          <div class="empty-state__icon" id="icon-sin-usuarios"></div>
          <div class="empty-state__title">Sin usuarios</div>
          <div class="empty-state__body">No hay usuarios que coincidan con el filtro aplicado.</div>
        </div>
      </div>
      <div id="pag-usuarios"></div>
    </div>
  </div>
</div>
</main>
<footer class="site-footer" id="footer"></footer>

<script src="js/icons.js"></script>
<script src="js/i18n.js?v=3"></script>
<script src="js/auth.js?v=2"></script>
<script>
requireAdmin();
const ME = Auth.get();
document.getElementById('icon-sin-usuarios').innerHTML = ICONS.users(40);

/* rol_id: 1=admin, 2=particular, 3=propietario */
const ROLES_LABEL = { 1:'Admin', 2:'Particular', 3:'Propietario' };
const ROLES_BADGE = { 1:'badge-red', 2:'badge-blue', 3:'badge-green' };

let usuarios = [];            // sólo la página que se está mostrando
let paginaActual = 1;
let temporizadorBusqueda = null;

/* ── Carga de una página ────────────────────────────────────────
   El filtrado va en el servidor: si filtráramos acá sólo se filtraría la
   página visible, que es justo lo que rompería la paginación. */
async function cargarUsuarios(pagina = paginaActual) {
  paginaActual = pagina;

  /* El contenedor es un <tbody>, así que el placeholder va como fila propia. */
  document.getElementById('tbody-usuarios').innerHTML =
    `<tr><td colspan="6" style="text-align:center;padding:2rem;color:var(--soft);font-size:.85rem">
       <span class="spinner" style="vertical-align:middle;margin-right:.5rem"></span>Cargando usuarios…</td></tr>`;

  const params = new URLSearchParams({ pagina, por_pagina: 20 });
  const rol = document.getElementById('f-rol').value;
  const q   = document.getElementById('f-buscar').value.trim();
  if (rol) params.set('rol', rol);
  if (q)   params.set('q', q);

  const res = await apiFetch('/api/usuarios.php?' + params)
                    .catch(() => ({ ok: false, error: 'Error de conexión con el servidor.' }));
  if (!res.ok) {
    document.getElementById('tbody-usuarios').innerHTML = '';
    document.getElementById('pag-usuarios').innerHTML   = '';
    showAlert('alert-accion', 'No se pudieron cargar los usuarios. ' + (res.error || ''), 'error');
    return;
  }

  /* Si el filtro dejó vacía la última página, se retrocede una. */
  if (!res.data.length && pagina > 1) return cargarUsuarios(pagina - 1);

  usuarios = res.data;
  renderTabla();
  renderPaginacion('pag-usuarios', res.meta, cargarUsuarios);
}

/* Espera a que el admin deje de tipear antes de consultar al servidor. */
function buscarConRetardo() {
  clearTimeout(temporizadorBusqueda);
  temporizadorBusqueda = setTimeout(() => cargarUsuarios(1), 300);
}

/* ── Renderizado de la página actual ────────────────────────────── */
function renderTabla() {
  const lista = usuarios;

  const tbody = document.getElementById('tbody-usuarios');
  const sinRes = document.getElementById('sin-resultados');

  if (!lista.length) {
    tbody.innerHTML = '';
    sinRes.style.display = '';
    return;
  }
  sinRes.style.display = 'none';

  tbody.innerHTML = lista.map(u => {
    const esMismo = +u.id === +ME?.id;
    const inicial = (u.nombre || '?')[0].toUpperCase();
    const fecha   = u.creado_en ? u.creado_en.slice(0, 10) : '—';
    return `<tr>
      <td>
        <div style="display:flex;align-items:center;gap:.6rem">
          <div style="width:30px;height:30px;border-radius:50%;background:var(--accent);
                      display:flex;align-items:center;justify-content:center;
                      font-size:.82rem;font-weight:900;color:#fff;flex-shrink:0">${inicial}</div>
          <div style="font-weight:700;font-size:.88rem">${escapeHtml(u.nombre)}</div>
        </div>
      </td>
      <td style="font-size:.85rem">${escapeHtml(u.email)}</td>
      <td><span class="badge ${ROLES_BADGE[u.rol_id]||'badge-blue'}">${ROLES_LABEL[u.rol_id]||'Rol '+u.rol_id}</span></td>
      <td style="font-size:.82rem;color:var(--soft)">${fecha}</td>
      <td><span class="badge ${+u.activo ? 'badge-green' : 'badge-gray'}">${+u.activo ? 'Activo' : 'Suspendido'}</span></td>
      <td>
        ${esMismo ? '<span style="font-size:.78rem;color:var(--soft)">Tu cuenta</span>' : `
          <div style="display:flex;gap:.3rem;flex-wrap:wrap">
            <select class="form-select" style="font-size:.78rem;padding:.25rem .4rem;width:auto"
                    onchange="cambiarRol(${u.id}, +this.value)">
              ${Object.entries(ROLES_LABEL).map(([k,v])=>
                `<option value="${k}" ${+u.rol_id===+k?'selected':''}>${v}</option>`).join('')}
            </select>
            <button class="btn btn--sm btn--${+u.activo?'warn':'green'}"
                    onclick="toggleActivo(${u.id})">
              ${+u.activo ? 'Suspender' : 'Activar'}
            </button>
          </div>
        `}
      </td>
    </tr>`;
  }).join('');
}

/* ── Acciones ───────────────────────────────────────────────────── */
async function patchUsuario(id, campo, valor, msgOk, tipoOk = 'success') {
  const res = await apiFetch('/api/usuarios.php', 'PATCH', { id, [campo]: valor });
  if (res.ok) {
    mostrarAlerta(msgOk, tipoOk);
    /* Se recarga la página en vez de tocar el array local: si hay un filtro de
       rol activo, el usuario editado puede haber dejado de pertenecer a él. */
    cargarUsuarios();
  } else {
    mostrarAlerta('Error: ' + res.error, 'warn');
  }
}

function cambiarRol(id, rol_id) {
  patchUsuario(id, 'rol_id', rol_id, `✓ Rol actualizado a "${ROLES_LABEL[rol_id]}".`);
}

function toggleActivo(id) {
  const u      = usuarios.find(x => +x.id === id);
  const activo = u ? (!+u.activo ? 1 : 0) : 1;
  patchUsuario(id, 'activo', activo, `✓ Usuario ${activo ? 'activado' : 'suspendido'}.`, activo ? 'success' : 'warn');
}

function mostrarAlerta(msg, tipo) { showAlert('alert-accion', msg, tipo, 3000); }

cargarUsuarios(1);
</script>
</body>
</html>
