<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon"             type="image/x-icon"  href="img/favicon.ico">
  <link rel="icon"             type="image/png"     href="img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon"                      href="img/apple-touch-icon.png">
  <meta name="theme-color"     content="#1A2E44">
  <title>Panel Admin — E-Find</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Gestión centralizada de cargadores, usuarios, reseñas y reportes de la plataforma E-Find.">
  <meta property="og:title"       content="Panel de administración — E-Find">
  <meta property="og:description" content="Gestión centralizada de cargadores, usuarios, reseñas y reportes de la plataforma E-Find.">
  <meta property="og:image"       content="https://efindapp.com/img/efind-dark.png">
  <meta property="og:type"        content="website">
  <meta name="twitter:card"       content="summary_large_image">
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<main class="main-content page-enter">
<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-sidebar anim-fade-in anim-d1">
    <div class="sidebar-section">Principal</div>
    <a href="admin.html"    class="sidebar-link active"><span class="ico" data-icon="chart" data-size="18"></span><span>Dashboard</span></a>
    <a href="admin.html#cargadores" class="sidebar-link"><span class="ico" data-icon="bolt" data-size="18"></span><span>Cargadores</span></a>
    <a href="usuarios.html" class="sidebar-link"><span class="ico" data-icon="users" data-size="18"></span><span>Usuarios</span></a>
    <div class="sidebar-section">Moderación</div>
    <a href="admin.html#resenas"  class="sidebar-link"><span class="ico" data-icon="sun" data-size="18"></span><span>Reseñas</span></a>
    <a href="admin.html#reportes" class="sidebar-link"><span class="ico" data-icon="warning" data-size="18"></span><span>Reportes</span></a>
    <div class="sidebar-section">Sistema</div>
    <a href="index.html"  class="sidebar-link"><span class="ico" data-icon="globe" data-size="18"></span><span>Ver mapa</span></a>
  </aside>

  <!-- Contenido -->
  <div class="admin-content anim-fade-up anim-d2">
    <h1 class="admin-title">Dashboard</h1>

    <!-- KPIs -->
    <div class="kpi-grid" id="kpi-grid"></div>

    <div style="display:grid;grid-template-columns:2fr 1fr;gap:1.25rem;margin-top:1.25rem;flex-wrap:wrap">

      <!-- Gráfico mensual -->
      <div class="card">
        <div class="card__title"><span data-icon="chartUp" data-size="16"></span> Cargadores registrados por mes (2026)</div>
        <div class="bar-chart" id="bar-chart"></div>
        <div id="bar-labels" style="display:flex;gap:6px;margin-top:4px"></div>
      </div>

      <!-- Distribución roles -->
      <div class="card">
        <div class="card__title"><span data-icon="users" data-size="16"></span> Distribución por rol</div>
        <canvas id="donut-canvas" width="160" height="160" style="display:block;margin:0 auto"></canvas>
        <div id="donut-legend" style="margin-top:.75rem;font-size:.8rem"></div>
      </div>
    </div>

    <!-- Cola de reseñas -->
    <div class="card" id="resenas" style="margin-top:1.25rem">
      <div class="card__title"><span data-icon="sun" data-size="16"></span> Reseñas pendientes de moderación</div>
      <div id="lista-resenas-pend"></div>
      <div id="pag-resenas"></div>
    </div>

    <!-- Reportes abiertos -->
    <div class="card" id="reportes" style="margin-top:1.25rem">
      <div class="card__title"><span data-icon="warning" data-size="16"></span> Reportes abiertos</div>
      <div id="alert-admin" role="status" aria-live="polite" style="display:none;margin-bottom:.75rem"></div>
      <div id="lista-reportes"></div>
      <div id="pag-reportes"></div>
    </div>

    <!-- Últimos cargadores -->
    <div class="card" id="cargadores" style="margin-top:1.25rem">
      <div class="card__title" style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem">
        <span><span data-icon="bolt" data-size="16"></span> Últimos cargadores registrados</span>
        <div style="display:flex;align-items:center;gap:.6rem">
          <span id="sync-ute-estado" style="font-size:.78rem"></span>
          <button id="btn-sync-ute" class="btn btn--outline btn--sm" onclick="sincronizarUTE()">Actualizar cargadores UTE</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Nombre</th><th>Dirección</th><th>Estado</th><th>Conectores</th><th></th></tr></thead>
          <tbody id="tbody-cargadores"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</main>
<footer class="site-footer" id="footer"></footer>

<script src="js/mock-data.js"></script>
<script src="js/icons.js"></script>
<script src="js/report-types.js"></script>
<script src="js/i18n.js?v=3"></script>
<script src="js/auth.js?v=2"></script>
<script>
requireAdmin();

/* Estado global */
let resenas  = [];
let reportes = [];

/* ── Carga inicial: todas las APIs en paralelo ───────────────── */
const POR_PAGINA = 10;
let paginaResenas  = 1;
let paginaReportes = 1;

async function initDashboard() {
  const [sRes, eRes] = await Promise.all([
    apiFetch('/api/stats.php').catch(() => ({ ok: false })),
    apiFetch('/api/estaciones.php?limit=5').catch(() => ({ ok: false })),
  ]);
  if (sRes.ok) renderStats(sRes.data);
  if (eRes.ok) renderCargadores(eRes.data);

  /* Cada lista se carga y se pagina por su cuenta, así moderar un ítem
     recarga sólo esa lista y no todo el dashboard. */
  cargarResenas(1);
  cargarReportes(1);
}

async function cargarResenas(pagina = paginaResenas) {
  paginaResenas = pagina;
  mostrarCargando('lista-resenas-pend');
  const res = await apiFetch(`/api/resenas.php?pagina=${pagina}&por_pagina=${POR_PAGINA}`)
                    .catch(() => ({ ok: false }));
  if (!res.ok) {
    document.getElementById('pag-resenas').innerHTML = '';
    showAlert('lista-resenas-pend', 'No se pudieron cargar las reseñas.', 'warn');
    return;
  }
  /* Si se moderó el último ítem de la última página, esa página quedó vacía
     y hay que retroceder, si no se ve "sin reseñas" habiendo reseñas atrás. */
  if (!res.data.length && pagina > 1) return cargarResenas(pagina - 1);

  resenas = res.data;
  renderResenas();
  renderPaginacion('pag-resenas', res.meta, cargarResenas);
}

async function cargarReportes(pagina = paginaReportes) {
  paginaReportes = pagina;
  mostrarCargando('lista-reportes');
  const res = await apiFetch(`/api/reportes.php?pagina=${pagina}&por_pagina=${POR_PAGINA}`)
                    .catch(() => ({ ok: false }));
  if (!res.ok) {
    document.getElementById('pag-reportes').innerHTML = '';
    showAlert('lista-reportes', 'No se pudieron cargar los reportes.', 'warn');
    return;
  }
  if (!res.data.length && pagina > 1) return cargarReportes(pagina - 1);

  reportes = res.data;
  renderReportes();
  renderPaginacion('pag-reportes', res.meta, cargarReportes);
}

/* ── KPIs + gráficos ─────────────────────────────────────────── */
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function renderStats(s) {
  /* KPIs */
  const kpis = [
    { label:'Cargadores totales',   value: s.cargadores_total,   diff:'+1 este mes', ico:'bolt'    },
    { label:'Usuarios registrados', value: s.usuarios_total,     diff:'+2 este mes', ico:'user'    },
    { label:'Reseñas pendientes',   value: s.resenas_pendientes, diff:'',            ico:'sun'     },
    { label:'Reportes abiertos',    value: s.reportes_abiertos,  diff:'',            ico:'warning' },
  ];
  document.getElementById('kpi-grid').innerHTML = kpis.map(k=>`
    <div class="kpi-card">
      <div class="kpi-label">${ICONS[k.ico]?.(20)||k.ico} ${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      ${k.diff ? `<div class="kpi-diff">${k.diff}</div>` : ''}
    </div>`).join('');

  /* Gráfico de barras */
  const datos = s.cargadores_por_mes;
  const maxD  = Math.max(...datos, 1);
  document.getElementById('bar-chart').innerHTML = datos.map(v=>`
    <div class="bar-col">
      <div class="bar" style="height:${Math.round((v/maxD)*100)}px;background:${v?'var(--accent)':'var(--border)'}"></div>
    </div>`).join('');
  document.getElementById('bar-labels').innerHTML = MESES.map(m=>`
    <div class="bar-col"><div class="bar-label">${m}</div></div>`).join('');

  /* Donut de roles */
  const roleOrder  = ['particular', 'propietario', 'admin'];
  const roleLabels = ['Particular', 'Propietario', 'Admin'];
  const colores    = ['#2D7DD2', '#3BB273', '#1A2E44'];
  const vals  = roleOrder.map(r => s.usuarios_por_rol[r] || 0);
  const total = vals.reduce((a,b)=>a+b,0) || 1;

  const canvas = document.getElementById('donut-canvas');
  const ctx    = canvas.getContext('2d');
  let ang = -Math.PI/2;
  vals.forEach((v,i) => {
    const slice = (v/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(80,80);
    ctx.arc(80,80,70,ang,ang+slice); ctx.closePath();
    ctx.fillStyle = colores[i]; ctx.fill();
    ang += slice;
  });
  /* Hueco donut */
  ctx.beginPath(); ctx.arc(80,80,42,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.fillStyle='#1A2E44'; ctx.font='bold 22px system-ui';
  ctx.textAlign='center'; ctx.fillText(total,80,85);

  document.getElementById('donut-legend').innerHTML = roleLabels.map((n,i)=>`
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
      <span style="width:10px;height:10px;border-radius:2px;background:${colores[i]};display:inline-block"></span>
      ${n}: <strong>${vals[i]}</strong>
    </div>`).join('');

  I18N.apply(false);
}

/* ── Reseñas pendientes ─────────────────────────────────────── */
function renderResenas() {
  const pend = resenas;   // la API ya devuelve sólo las pendientes de esta página
  const el   = document.getElementById('lista-resenas-pend');
  el.className = '';      // por si quedó con clase de alerta de un error previo
  el.innerHTML = pend.length ? `
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>Usuario</th><th>Cargador</th><th>Estrellas</th><th>Comentario</th><th>Acciones</th></tr></thead>
      <tbody>${pend.map(r=>`<tr>
        <td>${escapeHtml(r.usuario_nombre)}</td>
        <td>${escapeHtml(r.cargador_nombre)}</td>
        <td><span style="display:inline-flex;align-items:center;gap:1px">
          ${solesHTML(r.estrellas, 14)}
        </span></td>
        <td style="font-size:.82rem">${escapeHtml(r.texto)}</td>
        <td style="white-space:nowrap">
          <button class="btn btn--green btn--sm" onclick="modResena(${r.id},'aprobada')">${ICONS.checkCircle(14)} Aprobar</button>
          <button class="btn btn--warn btn--sm"  onclick="modResena(${r.id},'rechazada')">${ICONS.xCircle(14)} Rechazar</button>
        </td>
      </tr>`).join('')}</tbody>
    </table></div>`
    : '<p style="font-size:.88rem;color:var(--soft)">Sin reseñas pendientes. ✓</p>';
  I18N.apply(false);
}

async function modResena(id, estado) {
  const res = await apiFetch('/api/resenas.php', 'PATCH', { id, estado });
  /* Se recarga la página: la reseña moderada sale de la lista y las de las
     páginas siguientes se corren un lugar. */
  if (res.ok) cargarResenas();
}

/* ── Reportes abiertos ──────────────────────────────────────── */
function renderReportes() {
  const pend = reportes;  // la API ya devuelve sólo los sin resolver de esta página
  const el   = document.getElementById('lista-reportes');
  el.className = '';      // por si quedó con clase de alerta de un error previo
  el.innerHTML = pend.length ? `
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>Cargador</th><th>Tipo</th><th>Descripción</th><th>Reportado por</th><th>Fecha</th><th>Aplicar estado</th><th>Acción</th></tr></thead>
      <tbody>${pend.map(r=>{
        const huerfano = !r.punto_carga_nombre;
        return `<tr>
        <td>${huerfano
            ? `<span style="color:var(--soft)" title="El cargador ya no existe en la base">Cargador #${r.punto_carga_id} (eliminado)</span>`
            : `<a href="cargador.html?id=${r.punto_carga_id}">${escapeHtml(r.punto_carga_nombre)}</a>`}</td>
        <td>${REPORT_TIPOS[r.tipo] || r.tipo}</td>
        <td style="font-size:.82rem">${escapeHtml(r.descripcion) || '—'}</td>
        <td>${escapeHtml(r.usuario_nombre) || '—'}</td>
        <td>${r.creado_en ? r.creado_en.slice(0,10) : ''}</td>
        <td>
          ${huerfano ? '—' : `
          <select id="estado-sel-${r.id}" class="form-select" style="font-size:.8rem;padding:.2rem .4rem">
            <option value="">No cambiar</option>
            <option value="disponible">Disponible</option>
            <option value="ocupado">Ocupado</option>
            <option value="sin_servicio">Fuera de servicio</option>
          </select>`}
        </td>
        <td><button class="btn btn--green btn--sm" onclick="resolverReporte(${r.id}, ${r.punto_carga_id})">Resolver</button></td>
      </tr>`;
      }).join('')}</tbody>
    </table></div>`
    : '<p style="font-size:.88rem;color:var(--soft)">Sin reportes pendientes. ✓</p>';
  I18N.apply(false);
}

async function resolverReporte(id, puntoCargaId) {
  const sel = document.getElementById(`estado-sel-${id}`);
  const nuevoEstado = sel ? sel.value : '';

  // Si el admin eligió un estado, aplicarlo al cargador primero
  if (nuevoEstado) {
    const rEstado = await apiFetch('/api/estado.php', 'PATCH', { punto_carga_id: puntoCargaId, estado: nuevoEstado });
    if (!rEstado.ok) {
      showAlert('alert-admin', 'No se pudo actualizar el estado del cargador. ' + (rEstado.error || ''), 'error', 5000);
      return;
    }
  }

  const res = await apiFetch('/api/reportes.php', 'PATCH', { id });
  if (res.ok) cargarReportes();
}

/* ── Últimos cargadores ─────────────────────────────────────── */
const badgeMap = { disponible:'badge-green', ocupado:'badge-orange', sin_servicio:'badge-gray' };
function renderCargadores(lista) {
  document.getElementById('tbody-cargadores').innerHTML = lista.map(c=>{
    const tipos = [...new Set((c.conectores||[]).map(x=>x.tipo))].join(', ') || '—';
    return `<tr>
    <td><a href="cargador.html?id=${c.id}">${escapeHtml(c.nombre)}</a> ${c.fuente==='ute' ? '<span class="badge badge-ute" style="font-size:.6rem;padding:.1rem .35rem">UTE</span>' : ''}</td>
    <td style="font-size:.82rem;color:var(--soft)">${c.acceso || ''}</td>
    <td><span class="badge ${badgeMap[c.estado]||''}">${c.estado}</span></td>
    <td style="font-size:.82rem">${tipos}</td>
    <td><a href="cargador.html?id=${c.id}" class="btn btn--ghost btn--sm">Ver</a></td>
  </tr>`;
  }).join('');
  I18N.apply(false);
}

/* ── Sincronización manual de cargadores UTE ─────────────────── */
async function sincronizarUTE() {
  const btn = document.getElementById('btn-sync-ute');
  const estadoEl = document.getElementById('sync-ute-estado');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Sincronizando…';
  estadoEl.textContent = '';

  try {
    const json = await apiFetch('/api/ute-sync.php', 'POST');
    if (json.ok) {
      const d = json.data;
      estadoEl.textContent = `✓ ${d.creados} nuevas, ${d.actualizados} actualizadas (de ${d.total_ute} en UTE).`;
      estadoEl.style.color = 'var(--success, #2A8F59)';
      initDashboard(); // refrescar la tabla de "últimos cargadores"
    } else {
      estadoEl.textContent = '✗ ' + (json.error || 'Error al sincronizar.');
      estadoEl.style.color = 'var(--warn, #C4532A)';
    }
  } catch (err) {
    estadoEl.textContent = '✗ Error de conexión con el servidor.';
    estadoEl.style.color = 'var(--warn, #C4532A)';
  }

  btn.disabled = false;
  btn.innerHTML = 'Actualizar cargadores UTE';
}

/* ── Sidebar: resaltar el link de la sección visible ─────────── */
(function () {
  const links = document.querySelectorAll('.admin-sidebar .sidebar-link[href^="admin.html"]');

  function marcarActivo(id) {
    links.forEach(l => {
      const linkId = l.getAttribute('href').split('#')[1] || '';
      l.classList.toggle('active', (id || '') === linkId);
    });
  }

  links.forEach(l => l.addEventListener('click', () => {
    marcarActivo(l.getAttribute('href').split('#')[1] || null);
  }));

  const secciones = ['cargadores', 'resenas', 'reportes']
    .map(id => document.getElementById(id))
    .filter(Boolean);

  if ('IntersectionObserver' in window && secciones.length) {
    const obs = new IntersectionObserver(entries => {
      const visible = entries
        .filter(e => e.isIntersecting)
        .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
      if (visible) marcarActivo(visible.target.id);
      else if (window.scrollY < 100) marcarActivo(null);
    }, { rootMargin: '-70px 0px -60% 0px', threshold: [0, 0.25, 0.5] });
    secciones.forEach(s => obs.observe(s));
  }

  if (location.hash) marcarActivo(location.hash.slice(1));
})();

/* ── Init ─────────────────────────────────────────────────────── */
initDashboard();
</script>
</body>
</html>
