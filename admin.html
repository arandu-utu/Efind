<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon"             type="image/x-icon"  href="img/favicon.ico">
  <link rel="icon"             type="image/png"     href="img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon"                      href="img/apple-touch-icon.png">
  <meta name="theme-color"     content="#1A2E44">
  <title>Panel Admin — E-Find</title>
  <link rel="stylesheet" href="css/style.css">
  <meta name="description" content="Gestión centralizada de cargadores, usuarios, reseñas y reportes de la plataforma E-Find.">
  <meta property="og:title"       content="Panel de administración — E-Find">
  <meta property="og:description" content="Gestión centralizada de cargadores, usuarios, reseñas y reportes de la plataforma E-Find.">
  <meta property="og:image"       content="https://efind.uy/img/efind-dark.png">
  <meta property="og:type"        content="website">
  <meta name="twitter:card"       content="summary_large_image">
</head>
<body>
<nav class="navbar" id="navbar"></nav>
<main class="main-content page-enter">
<div class="admin-layout">

  <!-- Sidebar -->
  <aside class="admin-sidebar anim-fade-in anim-d1">
    <div class="sidebar-section">Principal</div>
    <a href="admin.html"    class="sidebar-link active"><span class="ico" data-icon="chart" data-size="18"></span><span>Dashboard</span></a>
    <a href="admin.html#cargadores" class="sidebar-link"><span class="ico" data-icon="bolt" data-size="18"></span><span>Cargadores</span></a>
    <a href="usuarios.html" class="sidebar-link"><span class="ico" data-icon="users" data-size="18"></span><span>Usuarios</span></a>
    <div class="sidebar-section">Moderación</div>
    <a href="admin.html#resenas"  class="sidebar-link"><span class="ico" data-icon="sun" data-size="18"></span><span>Reseñas</span></a>
    <a href="admin.html#reportes" class="sidebar-link"><span class="ico" data-icon="warning" data-size="18"></span><span>Reportes</span></a>
    <div class="sidebar-section">Sistema</div>
    <a href="index.html"  class="sidebar-link"><span class="ico" data-icon="globe" data-size="18"></span><span>Ver mapa</span></a>
  </aside>

  <!-- Contenido -->
  <div class="admin-content anim-fade-up anim-d2">
    <h1 class="admin-title">Dashboard</h1>

    <!-- KPIs -->
    <div class="kpi-grid" id="kpi-grid"></div>

    <div style="display:grid;grid-template-columns:2fr 1fr;gap:1.25rem;margin-top:1.25rem;flex-wrap:wrap">

      <!-- Gráfico mensual -->
      <div class="card">
        <div class="card__title"><span data-icon="chartUp" data-size="16"></span> Cargadores registrados por mes (2026)</div>
        <div class="bar-chart" id="bar-chart"></div>
        <div id="bar-labels" style="display:flex;gap:6px;margin-top:4px"></div>
      </div>

      <!-- Distribución roles -->
      <div class="card">
        <div class="card__title"><span data-icon="users" data-size="16"></span> Distribución por rol</div>
        <canvas id="donut-canvas" width="160" height="160" style="display:block;margin:0 auto"></canvas>
        <div id="donut-legend" style="margin-top:.75rem;font-size:.8rem"></div>
      </div>
    </div>

    <!-- Cola de reseñas -->
    <div class="card" id="resenas" style="margin-top:1.25rem">
      <div class="card__title"><span data-icon="sun" data-size="16"></span> Reseñas pendientes de moderación</div>
      <div id="lista-resenas-pend"></div>
    </div>

    <!-- Reportes abiertos -->
    <div class="card" id="reportes" style="margin-top:1.25rem">
      <div class="card__title"><span data-icon="warning" data-size="16"></span> Reportes abiertos</div>
      <div id="lista-reportes"></div>
    </div>

    <!-- Últimos cargadores -->
    <div class="card" id="cargadores" style="margin-top:1.25rem">
      <div class="card__title"><span data-icon="bolt" data-size="16"></span> Últimos cargadores registrados</div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Nombre</th><th>Dirección</th><th>Estado</th><th>Conectores</th><th></th></tr></thead>
          <tbody id="tbody-cargadores"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</main>
<footer class="site-footer" id="footer"></footer>

<script src="js/mock-data.js"></script>
<script src="js/icons.js"></script>
<script src="js/auth.js"></script>
<script>
requireAdmin();

/* Estado global */
let resenas  = [];
let reportes = [];

/* ── Carga inicial: todas las APIs en paralelo ───────────────── */
async function initDashboard() {
  try {
    const [sRes, rRes, reRes, eRes] = await Promise.all([
      fetch('/api/stats.php').then(r => r.json()),
      fetch('/api/reportes.php').then(r => r.json()),
      fetch('/api/resenas.php').then(r => r.json()),
      fetch('/api/estaciones.php?limit=5').then(r => r.json()),
    ]);

    if (sRes.ok)  renderStats(sRes.data);
    if (rRes.ok)  { reportes = rRes.data;  renderReportes(); }
    if (reRes.ok) { resenas  = reRes.data; renderResenas();  }
    if (eRes.ok)  renderCargadores(eRes.data);

  } catch (e) {
    console.error('Error al cargar dashboard:', e);
  }
}

/* ── KPIs + gráficos ─────────────────────────────────────────── */
const MESES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function renderStats(s) {
  /* KPIs */
  const kpis = [
    { label:'Cargadores totales',   value: s.cargadores_total,   diff:'+1 este mes', ico:'bolt'    },
    { label:'Usuarios registrados', value: s.usuarios_total,     diff:'+2 este mes', ico:'user'    },
    { label:'Reseñas pendientes',   value: s.resenas_pendientes, diff:'',            ico:'sun'     },
    { label:'Reportes abiertos',    value: s.reportes_abiertos,  diff:'',            ico:'warning' },
  ];
  document.getElementById('kpi-grid').innerHTML = kpis.map(k=>`
    <div class="kpi-card">
      <div class="kpi-label">${ICONS[k.ico]?.(20)||k.ico} ${k.label}</div>
      <div class="kpi-value">${k.value}</div>
      ${k.diff ? `<div class="kpi-diff">${k.diff}</div>` : ''}
    </div>`).join('');

  /* Gráfico de barras */
  const datos = s.cargadores_por_mes;
  const maxD  = Math.max(...datos, 1);
  document.getElementById('bar-chart').innerHTML = datos.map(v=>`
    <div class="bar-col">
      <div class="bar" style="height:${Math.round((v/maxD)*100)}px;background:${v?'var(--accent)':'var(--border)'}"></div>
    </div>`).join('');
  document.getElementById('bar-labels').innerHTML = MESES.map(m=>`
    <div class="bar-col"><div class="bar-label">${m}</div></div>`).join('');

  /* Donut de roles */
  const roleOrder  = ['particular', 'propietario', 'admin'];
  const roleLabels = ['Particular', 'Propietario', 'Admin'];
  const colores    = ['#2D7DD2', '#3BB273', '#1A2E44'];
  const vals  = roleOrder.map(r => s.usuarios_por_rol[r] || 0);
  const total = vals.reduce((a,b)=>a+b,0) || 1;

  const canvas = document.getElementById('donut-canvas');
  const ctx    = canvas.getContext('2d');
  let ang = -Math.PI/2;
  vals.forEach((v,i) => {
    const slice = (v/total)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(80,80);
    ctx.arc(80,80,70,ang,ang+slice); ctx.closePath();
    ctx.fillStyle = colores[i]; ctx.fill();
    ang += slice;
  });
  /* Hueco donut */
  ctx.beginPath(); ctx.arc(80,80,42,0,Math.PI*2);
  ctx.fillStyle='#fff'; ctx.fill();
  ctx.fillStyle='#1A2E44'; ctx.font='bold 22px system-ui';
  ctx.textAlign='center'; ctx.fillText(total,80,85);

  document.getElementById('donut-legend').innerHTML = roleLabels.map((n,i)=>`
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
      <span style="width:10px;height:10px;border-radius:2px;background:${colores[i]};display:inline-block"></span>
      ${n}: <strong>${vals[i]}</strong>
    </div>`).join('');
}

/* ── Reseñas pendientes ─────────────────────────────────────── */
function renderResenas() {
  const pend = resenas.filter(r => r.estado === 'pendiente');
  const el   = document.getElementById('lista-resenas-pend');
  el.innerHTML = pend.length ? `
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>Usuario</th><th>Cargador</th><th>Estrellas</th><th>Comentario</th><th>Acciones</th></tr></thead>
      <tbody>${pend.map(r=>`<tr>
        <td>${r.usuario_nombre}</td>
        <td>${r.cargador_nombre}</td>
        <td><span style="display:inline-flex;align-items:center;gap:1px">
          ${Array.from({length:5},(_,i)=>`<span style="color:${i<r.estrellas?'#F5B800':'#C8D3DF'}">${solSVG(14)}</span>`).join('')}
        </span></td>
        <td style="font-size:.82rem">${r.texto || ''}</td>
        <td style="white-space:nowrap">
          <button class="btn btn--green btn--sm" onclick="modResena(${r.id},'aprobada')">${ICONS.checkCircle(14)} Aprobar</button>
          <button class="btn btn--warn btn--sm"  onclick="modResena(${r.id},'rechazada')">${ICONS.xCircle(14)} Rechazar</button>
        </td>
      </tr>`).join('')}</tbody>
    </table></div>`
    : '<p style="font-size:.88rem;color:var(--soft)">Sin reseñas pendientes. ✓</p>';
}

async function modResena(id, estado) {
  const res = await fetch('/api/resenas.php', {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ id, estado }),
  }).then(r => r.json());
  if (res.ok) {
    const item = resenas.find(x => x.id === id);
    if (item) item.estado = estado;
    renderResenas();
  }
}

/* ── Reportes abiertos ──────────────────────────────────────── */
function renderReportes() {
  const pend = reportes.filter(r => !+r.resuelto);
  const el   = document.getElementById('lista-reportes');
  el.innerHTML = pend.length ? `
    <div class="table-wrap"><table class="data-table">
      <thead><tr><th>Cargador</th><th>Tipo</th><th>Descripción</th><th>Reportado por</th><th>Fecha</th><th>Acción</th></tr></thead>
      <tbody>${pend.map(r=>`<tr>
        <td><a href="cargador.html?id=${r.punto_carga_id}">${r.punto_carga_nombre || 'Cargador #'+r.punto_carga_id}</a></td>
        <td>${r.tipo}</td>
        <td style="font-size:.82rem">${r.descripcion || '—'}</td>
        <td>${r.usuario_nombre || '—'}</td>
        <td>${r.creado_en ? r.creado_en.slice(0,10) : ''}</td>
        <td><button class="btn btn--green btn--sm" onclick="resolverReporte(${r.id})">Resolver</button></td>
      </tr>`).join('')}</tbody>
    </table></div>`
    : '<p style="font-size:.88rem;color:var(--soft)">Sin reportes pendientes. ✓</p>';
}

async function resolverReporte(id) {
  const res = await fetch('/api/reportes.php', {
    method: 'PATCH',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ id }),
  }).then(r => r.json());
  if (res.ok) {
    const item = reportes.find(x => x.id === id);
    if (item) item.resuelto = 1;
    renderReportes();
  }
}

/* ── Últimos cargadores ─────────────────────────────────────── */
const badgeMap = { disponible:'badge-green', ocupado:'badge-orange', sin_servicio:'badge-gray' };
function renderCargadores(lista) {
  document.getElementById('tbody-cargadores').innerHTML = lista.map(c=>`<tr>
    <td><a href="cargador.html?id=${c.id}">${c.nombre}</a></td>
    <td style="font-size:.82rem;color:var(--soft)">${c.acceso || ''}</td>
    <td><span class="badge ${badgeMap[c.estado]||''}">${c.estado}</span></td>
    <td style="font-size:.82rem">${c.tipos_conectores || '—'}</td>
    <td><a href="cargador.html?id=${c.id}" class="btn btn--ghost btn--sm">Ver</a></td>
  </tr>`).join('');
}

/* ── Init ─────────────────────────────────────────────────────── */
initDashboard();
</script>
</body>
</html>
