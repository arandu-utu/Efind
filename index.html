<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon"             type="image/x-icon"  href="img/favicon.ico">
  <link rel="icon"             type="image/png"     href="img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon"                      href="img/apple-touch-icon.png">
  <meta name="theme-color"     content="#1A2E44">
  <title>E-Find — Mapa de Cargadores</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <meta name="description" content="Encuentra puntos de carga para vehículos eléctricos en Uruguay. Mapa en tiempo real, filtros y reservas.">
  <meta property="og:title"       content="E-Find — Mapa de Cargadores">
  <meta property="og:description" content="Encuentra puntos de carga para vehículos eléctricos en Uruguay. Mapa en tiempo real, filtros y reservas.">
  <meta property="og:image"       content="https://efind.uy/img/efind-dark.png">
  <meta property="og:type"        content="website">
  <meta name="twitter:card"       content="summary_large_image">
</head>
<body>

<nav class="navbar" id="navbar"></nav>

<main class="main-content page-enter">
  <div class="map-layout">

    <!-- ── Sidebar ───────────────────────────────────────────── -->
    <aside class="map-sidebar">
      <div class="map-sidebar__head">
        <div style="position:relative">
          <span data-icon="search" data-size="14"
                style="position:absolute;left:.6rem;top:50%;transform:translateY(-50%);
                       color:var(--soft);pointer-events:none;display:flex"></span>
          <input
            type="text"
            id="buscador"
            class="form-input"
            placeholder="Buscar cargador o dirección…"
            data-i18n-placeholder="buscar_placeholder"
            style="font-size:.85rem;padding-left:2.1rem"
          >
        </div>
      </div>

      <div class="map-sidebar__body">

        <!-- Filtros -->
        <div class="filter-section">
          <div class="filter-title" data-i18n="tipo_conector">Tipo de conector</div>
          <label class="check-row"><input type="checkbox" class="f-tipo" value="Type 2"   checked> Type 2</label>
          <label class="check-row"><input type="checkbox" class="f-tipo" value="CCS2"     checked> CCS2</label>
          <label class="check-row"><input type="checkbox" class="f-tipo" value="CHAdeMO"  checked> CHAdeMO</label>
          <label class="check-row"><input type="checkbox" class="f-tipo" value="Schuko"   checked> Schuko</label>
          <label class="check-row"><input type="checkbox" class="f-tipo" value="GB/T AC"  checked> GB/T AC</label>
          <label class="check-row"><input type="checkbox" class="f-tipo" value="GB/T DC"  checked> GB/T DC</label>
        </div>

        <div class="filter-section">
          <div class="filter-title" data-i18n="potencia_minima">Potencia mínima</div>
          <select id="f-potencia" class="form-select" style="font-size:.85rem">
            <option value="0" data-i18n="potencia_cualquiera">Cualquiera</option>
            <option value="7">7 kW +</option>
            <option value="22">22 kW +</option>
            <option value="50">50 kW + (DC rápido)</option>
          </select>
        </div>

        <div class="filter-section">
          <div class="filter-title" data-i18n="estado">Estado</div>
          <label class="check-row"><input type="checkbox" class="f-estado" value="disponible" checked> <span class="badge badge-green"  style="font-size:.72rem" data-i18n="estado_disponible">Disponible</span></label>
          <label class="check-row"><input type="checkbox" class="f-estado" value="ocupado"    checked> <span class="badge badge-orange" style="font-size:.72rem" data-i18n="estado_ocupado">Ocupado</span></label>
          <label class="check-row"><input type="checkbox" class="f-estado" value="sin_servicio">       <span class="badge badge-gray"   style="font-size:.72rem" data-i18n="estado_sinservicio">Sin servicio</span></label>
        </div>

        <div class="filter-section">
          <div class="filter-title" data-i18n="acceso">Acceso</div>
          <label class="check-row"><input type="checkbox" class="f-acceso" value="publico"  checked> <span data-i18n="acceso_publico">Público</span></label>
          <label class="check-row"><input type="checkbox" class="f-acceso" value="privado"  checked> <span data-i18n="acceso_privado">Privado / Alquiler</span></label>
        </div>

        <div class="filter-section">
          <div class="filter-title" data-i18n="fuente">Fuente</div>
          <label class="check-row">
            <input type="checkbox" id="f-ute" checked>
            <span data-i18n="red_ute">Red UTE</span> <span class="badge badge-ute" style="font-size:.65rem;padding:.1rem .4rem">UTE</span>
          </label>
        </div>

        <div style="padding:.6rem 1rem">
          <button class="btn btn--primary btn--full btn--sm" id="btn-filtrar" data-i18n="aplicar_filtros">Aplicar filtros</button>
        </div>

        <!-- Lista resultado -->
        <div class="charger-list" id="charger-list"></div>
      </div>
    </aside>

    <!-- ── Mapa ──────────────────────────────────────────────── -->
    <div id="mapa" class="map-container"></div>
  </div>
</main>

<!-- ── Modal detalle rápido ──────────────────────────────────── -->
<div id="popup-overlay" class="modal-overlay" style="display:none" onclick="if(event.target===this)cerrarPopup()">
  <div class="modal" id="popup-content"></div>
</div>

<footer class="site-footer" id="footer"></footer>

<!-- Scripts -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/icons.js"></script>
<script src="js/i18n.js?v=3"></script>
<script src="js/auth.js?v=2"></script>
<script src="js/estimador.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════
   MAPA PRINCIPAL
══════════════════════════════════════════════════════════════ */

// Inicializar mapa centrado en Montevideo
const map = L.map('mapa').setView([-34.9058, -56.1652], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  maxZoom: 19,
}).addTo(map);

// ── Paleta de colores por estado ─────────────────────────────
const COLORES = {
  disponible:   { fill: '#3BB273', border: '#2A8F59' },
  ocupado:      { fill: '#E76F51', border: '#C4532A' },
  sin_servicio: { fill: '#9E9E9E', border: '#6B6B6B' },
};

// ── Ícono E-Find (círculo = público, cuadrado = privado) ─────
function crearIcono(estado, publica) {
  const c = COLORES[estado] || COLORES.sin_servicio;
  const shape = publica
    ? `<circle cx="12" cy="12" r="8" fill="${c.fill}" stroke="${c.border}" stroke-width="2"/>`
    : `<rect x="4" y="4" width="16" height="16" rx="3" fill="${c.fill}" stroke="${c.border}" stroke-width="2"/>`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
    ${shape}
    <path d="M13.2 5.5L10 11h2.5l-.8 3.2L15 8.5h-2.5z" fill="white"/>
  </svg>`;
  return L.divIcon({
    className: '',
    html: `<div style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))">${svg}</div>`,
    iconSize:   [24, 24],
    iconAnchor: [12, 12],
  });
}

// ── Ícono UTE (diamante con "U") ─────────────────────────────
function crearIconoUTE(estado) {
  const c = COLORES[estado] || COLORES.sin_servicio;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26">
    <g transform="translate(13,13) rotate(45)">
      <rect x="-8" y="-8" width="16" height="16" rx="2"
            fill="${c.fill}" stroke="#1B4F9C" stroke-width="2.5"/>
    </g>
    <text x="13" y="17" text-anchor="middle"
          font-family="Arial,sans-serif" font-weight="900"
          font-size="9" fill="white">U</text>
  </svg>`;
  return L.divIcon({
    className: '',
    html: `<div style="filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))">${svg}</div>`,
    iconSize:   [26, 26],
    iconAnchor: [13, 13],
  });
}

// ── Estado E-Find ────────────────────────────────────────────
let marcadores = [];
let cargadoresFiltrados = [];

function renderMarcadores(lista) {
  marcadores.forEach(m => map.removeLayer(m));
  marcadores = [];
  lista.forEach(c => {
    const icono = c.fuente === 'ute'
      ? crearIconoUTE(c.estado)
      : crearIcono(c.estado, c.acceso === 'publico');
    const m = L.marker([c.lat, c.lng], { icon: icono })
      .addTo(map)
      .on('click', () => abrirPopup(c));
    marcadores.push(m);
  });
}

// ── Datos ───────────────────────────────────────────────────
let todasEstaciones = [];  // Todo lo que devuelve /api/estaciones.php (E-Find + UTE)

// ── Lista lateral ──────────────────────────────────────────
const _BADGE = { disponible: 'badge-green', ocupado: 'badge-orange', sin_servicio: 'badge-gray' };
const _ESTADO_KEY = { disponible: 'estado_disponible', ocupado: 'estado_ocupado', sin_servicio: 'estado_sinservicio' };
function _LABEL_OF(estado) {
  const key = _ESTADO_KEY[estado];
  return key ? I18N.t(key) : estado;
}

function renderLista(lista) {
  const el = document.getElementById('charger-list');

  const PESO = { disponible: 0, ocupado: 1, sin_servicio: 2 };
  const ordenada = [...lista].sort((a, b) => {
    const d = (PESO[a.estado] ?? 3) - (PESO[b.estado] ?? 3);
    return d !== 0 ? d : a.nombre.localeCompare(b.nombre);
  });

  if (!ordenada.length) {
    el.innerHTML = `<div class="empty-state" style="padding:2rem 1rem">
      <div class="empty-state__icon">${ICONS.bolt(40)}</div>
      <div class="empty-state__title">${I18N.t('sin_cargadores')}</div>
      <div class="empty-state__body">${I18N.t('sin_cargadores_body')}</div>
    </div>`;
    return;
  }

  el.innerHTML = ordenada.map(c => {
    const badge  = _BADGE[c.estado] ?? 'badge-gray';
    const label  = _LABEL_OF(c.estado);
    const potMax = c.conectores.length ? Math.max(...c.conectores.map(x => x.potencia)) : 0;
    const uteTag = c.fuente === 'ute'
      ? `<span class="badge badge-ute" style="font-size:.6rem;padding:.1rem .35rem;vertical-align:middle">UTE</span>`
      : '';
    return `
      <div class="charger-item" onclick="irA(${c.lat},${c.lng},${c.id})">
        <div class="charger-item__info">
          <strong>${escapeHtml(c.nombre)} ${uteTag}</strong>
          <span>${escapeHtml((c.direccion || '').split(',')[0])} · ${potMax} kW</span>
        </div>
        <span class="badge ${badge}" style="font-size:.7rem">${label}</span>
      </div>`;
  }).join('');
}

// ── Navegación al cargador ───────────────────────────────────
function irA(lat, lng, id) {
  map.setView([lat, lng], 16);
  const c = cargadoresFiltrados.find(x => x.id === id);
  if (c) setTimeout(() => abrirPopup(c), 300);
}

// ── Filtros ──────────────────────────────────────────────────
function aplicarFiltros() {
  const tipos      = [...document.querySelectorAll('.f-tipo:checked')].map(i => i.value);
  const estados    = [...document.querySelectorAll('.f-estado:checked')].map(i => i.value);
  const accesos    = [...document.querySelectorAll('.f-acceso:checked')].map(i => i.value);
  const potMin     = +document.getElementById('f-potencia').value;
  const busqueda   = document.getElementById('buscador').value.toLowerCase().trim();
  const mostrarUTE = document.getElementById('f-ute')?.checked ?? true;

  cargadoresFiltrados = todasEstaciones.filter(c => {
    if (c.fuente === 'ute' && !mostrarUTE) return false;
    if (!estados.includes(c.estado)) return false;
    if (!accesos.includes(c.acceso)) return false;
    if (!c.conectores.some(x => tipos.includes(x.tipo))) return false;
    if (!c.conectores.some(x => x.potencia >= potMin))  return false;
    if (busqueda && !c.nombre.toLowerCase().includes(busqueda)
                 && !(c.direccion || '').toLowerCase().includes(busqueda)) return false;
    return true;
  });

  renderMarcadores(cargadoresFiltrados);
  renderLista(cargadoresFiltrados);
}

// ── Popup ──────────────────────────────────────────────────
function abrirPopup(c) {
  const esUte      = c.fuente === 'ute';
  const badgeClass = _BADGE[c.estado] ?? 'badge-gray';
  const potMax     = c.conectores.length ? Math.max(...c.conectores.map(x => x.potencia)) : 0;
  const conTypes   = [...new Set(c.conectores.map(x => x.tipo))].join(' · ') || 'Sin datos';
  const precio     = c.costo_kwh ? `$${c.costo_kwh}/kWh` : I18N.t('gratuito');
  const horario    = c.horario || I18N.t('no_especificado');
  const uteTag     = esUte
    ? `<span class="badge badge-ute" style="font-size:.62rem;vertical-align:middle;padding:.1rem .4rem">UTE</span>`
    : '';
  const fuenteInfo = esUte
    ? `<p style="font-size:.75rem;color:var(--soft);margin-top:.4rem">Fuente: Red UTE · CargaME</p>`
    : '';
  const u = Auth.get();

  document.getElementById('popup-content').innerHTML = `
    <button class="modal__close" onclick="cerrarPopup()">&times;</button>
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.4rem">
      <h2 style="font-size:1.05rem;font-weight:800;color:var(--nav);flex:1">${escapeHtml(c.nombre)} ${uteTag}</h2>
      <span class="badge ${badgeClass}">${_LABEL_OF(c.estado)}</span>
    </div>
    <p style="font-size:.82rem;color:var(--soft);margin-bottom:.65rem">${escapeHtml(c.direccion)}</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.4rem .6rem;font-size:.82rem;margin:.65rem 0">
      <div><span style="color:var(--soft)">${I18N.t('potencia')}:</span> <strong>${potMax} kW</strong></div>
      <div><span style="color:var(--soft)">${I18N.t('conectores')}:</span> <strong>${conTypes}</strong></div>
      <div><span style="color:var(--soft)">${I18N.t('horario')}:</span> <strong>${horario}</strong></div>
      <div><span style="color:var(--soft)">${I18N.t('precio')}:</span> <strong>${precio}</strong></div>
    </div>
    ${fuenteInfo}
    <div style="display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap">
      <a href="cargador.html?id=${c.id}" class="btn btn--primary btn--sm">${I18N.t('ver_detalle')}</a>
      <a href="https://maps.google.com/?q=${c.lat},${c.lng}" target="_blank" class="btn btn--outline btn--sm">${I18N.t('como_llegar')}</a>
      ${u && !esUte ? `<a href="cargador.html?id=${c.id}&reportar=1" class="btn btn--ghost btn--sm">${I18N.t('reportar')}</a>` : ''}
    </div>
  `;
  document.getElementById('popup-overlay').style.display = 'flex';
}

function cerrarPopup() {
  document.getElementById('popup-overlay').style.display = 'none';
}

// ── Leyenda ──────────────────────────────────────────────────
const leyenda = L.control({ position: 'bottomright' });
leyenda.onAdd = () => {
  const div = L.DomUtil.create('div', '');
  div.style.cssText = 'background:white;padding:8px 10px;border-radius:8px;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.15);line-height:1.9';
  div.innerHTML = `
    <strong data-i18n="estado" style="display:block;margin-bottom:4px;color:#1A2E44;font-size:11px">Estado</strong>
    <div style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:#3BB273;flex-shrink:0"></span> <span data-i18n="estado_disponible">Disponible</span></div>
    <div style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:#E76F51;flex-shrink:0"></span> <span data-i18n="estado_ocupado">Ocupado</span></div>
    <div style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:50%;background:#9E9E9E;flex-shrink:0"></span> <span data-i18n="estado_sinservicio">Sin servicio</span></div>
    <hr style="border:none;border-top:1px solid #E5E7EB;margin:5px 0">
    <strong data-i18n="fuente" style="display:block;margin-bottom:4px;color:#1A2E44;font-size:11px">Fuente</strong>
    <div style="color:#5C6B82;display:flex;align-items:center;gap:5px;font-size:10px">
      <svg width="11" height="11" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#9E9E9E" stroke="#6B6B6B" stroke-width="2"/></svg> <span data-i18n="leyenda_efind_publico">E-Find público</span>
    </div>
    <div style="color:#5C6B82;display:flex;align-items:center;gap:5px;font-size:10px">
      <svg width="11" height="11" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3" fill="#9E9E9E" stroke="#6B6B6B" stroke-width="2"/></svg> <span data-i18n="leyenda_efind_privado">E-Find privado</span>
    </div>
    <div style="color:#5C6B82;display:flex;align-items:center;gap:5px;font-size:10px">
      <svg width="11" height="11" viewBox="0 0 26 26"><g transform="translate(13,13) rotate(45)"><rect x="-7" y="-7" width="14" height="14" rx="2" fill="#9E9E9E" stroke="#1B4F9C" stroke-width="2"/></g></svg> <span data-i18n="red_ute">Red UTE</span>
    </div>
  `;
  return div;
};
leyenda.addTo(map);

// ── Carga inicial de datos (E-Find + UTE sincronizadas, una sola API) ──
async function cargarEstaciones() {
  try {
    const res  = await fetch('/api/estaciones.php');
    const json = await res.json();
    if (json.ok) {
      todasEstaciones = json.data;
      console.info(`EfindAPI: ${todasEstaciones.length} estaciones cargadas.`);
    } else {
      console.warn('EfindAPI: error al cargar estaciones.', json.error);
    }
  } catch (err) {
    console.warn('EfindAPI: no se pudo conectar con el servidor.', err.message);
  }
  aplicarFiltros();
}

// ── Eventos ──────────────────────────────────────────────────
document.getElementById('btn-filtrar').addEventListener('click', aplicarFiltros);
document.getElementById('buscador').addEventListener('input', aplicarFiltros);
document.querySelectorAll('.f-tipo,.f-estado,.f-acceso').forEach(el => el.addEventListener('change', aplicarFiltros));
document.getElementById('f-potencia').addEventListener('change', aplicarFiltros);
document.getElementById('f-ute').addEventListener('change', aplicarFiltros);
window.addEventListener('i18n:change', aplicarFiltros);

// ── Arranque ─────────────────────────────────────────────────
cargarEstaciones();
</script>
</body>
</html>
